name: Build and dependency audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate dependency lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Save audit report and lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-and-lockfile
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
