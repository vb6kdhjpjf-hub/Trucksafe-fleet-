name: Build and dependency audit

on:
  # Run validation for every PR target, including the active safety-integration base.
  pull_request:
  push:
    branches: [main, fix/pretrip-safe-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Run security regression tests
        run: npm run test:security
      - name: Generate dependency lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
      - name: Save audit report and lockfile for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit-and-lockfile
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 7
