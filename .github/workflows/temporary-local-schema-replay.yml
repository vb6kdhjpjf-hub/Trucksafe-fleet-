name: Temporary local schema replay verification

on:
  pull_request:
    branches:
      - docs/route-assessment-atomic-trip-start
    paths:
      - ".github/workflows/temporary-local-schema-replay.yml"
      - "supabase/**"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out isolated test branch
        uses: actions/checkout@v7

      - name: Install original dump CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Export current Production schema without modifying it
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL secret is missing."
            exit 1
          fi
          supabase db dump --db-url="$SUPABASE_DB_URL" --file=/tmp/schema-baseline.sql
          unset SUPABASE_DB_URL
          actual="$(sha256sum /tmp/schema-baseline.sql | cut -d' ' -f1)"
          expected="cf7d094dea68849d827478cd583824651f50f57b8a5e1fee0e8cf46b6bece838"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Production schema does not byte-match the recovered 2026-11-05 baseline; refusing to replay migrations."
            echo "Expected baseline fingerprint: $expected"
            echo "Observed fingerprint: $actual"
            exit 1
          fi
          echo "Verified: read-only Production schema dump exactly matches the archived 2026-11-05 baseline."

      - name: Install pinned local migration CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.3.0

      - name: Start disposable local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_PROJECT_ID || true
          supabase start

      - name: Restore schema into disposable local database
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_PROJECT_ID || true
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 --single-transaction --file=/tmp/schema-baseline.sql
          echo "Recovered schema restored locally."

      - name: Apply every tracked migration locally
        shell: bash
        run: |
          set -euo pipefail
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_PROJECT_ID || true
          migration_files="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          if [ "$migration_files" -ne 46 ]; then
            echo "::error::Expected 46 tracked migrations, found $migration_files."
            exit 1
          fi
          supabase migration up
          applied="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atqc 'select count(*) from supabase_migrations.schema_migrations')"
          if [ "$applied" -ne "$migration_files" ]; then
            echo "::error::Expected $migration_files applied migrations, found $applied."
            exit 1
          fi
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('public.road_restrictions') IS NULL THEN
              RAISE EXCEPTION 'public.road_restrictions is missing';
            END IF;
            IF to_regclass('public.vehicle_special_equipment') IS NULL THEN
              RAISE EXCEPTION 'public.vehicle_special_equipment is missing after migrations';
            END IF;
          END $$;
          SQL
          echo "PASS: all $applied migrations applied; required schema objects verified."

      - name: Stop disposable local Supabase stack
        if: always()
        shell: bash
        run: |
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_PROJECT_ID || true
          supabase stop --no-backup || true
