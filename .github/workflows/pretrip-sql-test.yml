name: Pre-trip SQL integration test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feat/pretrip-defect-reporting

permissions:
  contents: read

concurrency:
  group: pretrip-sql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pretrip-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trucksafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trucksafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated test schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d trucksafe_test -v ON_ERROR_STOP=1 -f .github/tests/pretrip-fixture.sql
      - name: Apply pre-trip migration to isolated database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d trucksafe_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261104113000_pretrip_defect_reporting.sql
      - name: Run pre-trip lifecycle and security assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d trucksafe_test -v ON_ERROR_STOP=1 -f .github/tests/pretrip-assertions.sql

# Trigger validation after correcting the SQL test fixture.
