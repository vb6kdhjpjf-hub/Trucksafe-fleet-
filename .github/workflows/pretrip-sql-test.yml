name: Pre-trip SQL integration test

on:
  push:
    branches: [feat/pretrip-defect-reporting]
    paths:
      - "supabase/migrations/**"
      - ".github/tests/**"
      - ".github/workflows/pretrip-sql-test.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/tests/**"
      - ".github/workflows/pretrip-sql-test.yml"

permissions:
  contents: read

jobs:
  pretrip-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trucksafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trucksafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated test schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d trucksafe_test -v ON_ERROR_STOP=1 -f .github/tests/pretrip-fixture.sql
      - name: Apply pre-trip migration to isolated database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d trucksafe_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261104113000_pretrip_defect_reporting.sql
      - name: Run pre-trip lifecycle and security assertions
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d trucksafe_test -v ON_ERROR_STOP=1 -f .github/tests/pretrip-assertions.sql
