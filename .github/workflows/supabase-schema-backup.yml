name: Supabase schema-only backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Validate required secret is present
        shell: bash
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is missing or empty."
            exit 1
          fi

      - name: Export schema only (no data, no writes)
        shell: bash
        run: |
          set +x
          supabase db dump --db-url="$SUPABASE_DB_URL" --file=schema.sql

      - name: Upload schema artifact
        uses: actions/upload-artifact@v7
        with:
          name: trucksafe-schema-only
          path: schema.sql
          if-no-files-found: error
          retention-days: 1
