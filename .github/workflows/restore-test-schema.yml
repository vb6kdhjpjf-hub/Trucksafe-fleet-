name: Restore TruckSafe schema to isolated test database

on:
  workflow_dispatch:
    inputs:
      confirm_restore:
        description: "Type RESTORE to confirm restoring a verified schema-only snapshot to an empty TruckSafe Fleet Test database"
        required: true
        type: choice
        options:
          - NO
          - RESTORE
        default: NO
      schema_backup_run_id:
        description: "GitHub Actions run ID of a successful 'Supabase schema-only backup' run"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: trucksafe-test-schema-restore
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ inputs.confirm_restore == 'RESTORE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      SUPABASE_TEST_DB_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      SCHEMA_BACKUP_RUN_ID: ${{ inputs.schema_backup_run_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate isolated test credentials
        shell: bash
        run: |
          set +x
          python3 - <<'PY'
          import os
          target = os.environ.get("SUPABASE_TEST_DB_URL", "").strip()
          if target.startswith("psql "):
              target = target[5:].strip()
          target = target.strip("'").strip('"')
          if "://" not in target:
              raise SystemExit("Expected a PostgreSQL URI. In Supabase Connect, copy the URI itself (not the psql command).")
          scheme, rest = target.split("://", 1)
          if scheme not in ("postgres", "postgresql"):
              raise SystemExit("Connection URI must use the PostgreSQL scheme.")
          rest = rest.split("#", 1)[0].split("?", 1)[0]
          if "/" not in rest or "@" not in rest:
              raise SystemExit("Connection URI must include a database path and username/password.")
          authority, path = rest.split("/", 1)
          userinfo, endpoint = authority.rsplit("@", 1)
          if ":" not in userinfo or ":" not in endpoint:
              raise SystemExit("Pooler URI must include a password, host, and port.")
          username, password = userinfo.split(":", 1)
          host, port = endpoint.rsplit(":", 1)
          if not host.endswith(".pooler.supabase.com"):
              raise SystemExit("Refusing connection: expected the Supabase Session pooler host.")
          if port != "5432" or username != "postgres.yxxrgblpqzhnnyojbwcr" or path != "postgres":
              raise SystemExit("Refusing connection: expected this test project's Session pooler on port 5432 and database postgres.")
          if not password:
              raise SystemExit("Connection URI is missing its password.")
          print("Session pooler URI verified for the dedicated TruckSafe Fleet Test project; secret value hidden.")
          PY

      - name: Validate successful schema-backup run ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +x
          if [[ ! "$SCHEMA_BACKUP_RUN_ID" =~ ^[0-9]{5,20}$ ]]; then
            echo "::error::Provide the numeric run ID of a successful schema-only backup workflow."
            exit 1
          fi
          run_info="$(gh run view "$SCHEMA_BACKUP_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,workflowName)"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "completed" and d.get("conclusion") == "success" and d.get("workflowName") == "Supabase schema-only backup", "Run ID must belong to a successful Supabase schema-only backup workflow"' <<< "$run_info"

      - name: Download previously verified schema-only snapshot
        uses: actions/download-artifact@v8
        with:
          name: trucksafe-schema-only
          path: schema-artifact
          repository: vb6kdhjpjf-hub/Trucksafe-fleet-
          run-id: ${{ inputs.schema_backup_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate schema-only snapshot
        shell: bash
        run: |
          set +x
          test -s schema-artifact/schema.sql
          # pg_dump function bodies may contain INSERT text as executable function code.
          # Reject COPY blocks and top-level INSERT statements only; ignore SQL inside dollar-quoted bodies.
          python3 - <<'PY'
          from pathlib import Path
          import re
          sql = Path("schema-artifact/schema.sql").read_text()
          if re.search(r"(?im)^\\s*COPY\\s+[^;]+\\s+FROM\\s+stdin\\s*;", sql):
              raise SystemExit("Snapshot contains a COPY data block. Refusing to restore.")
          outside = []
          in_dollar = None
          for line in sql.splitlines():
              if in_dollar:
                  if in_dollar in line:
                      in_dollar = None
                  continue
              m = re.search(r"\\$[A-Za-z_0-9]*\\$", line)
              if m:
                  tag = m.group(0)
                  # Only scan SQL before the first function-body delimiter on this line.
                  prefix = line[:m.start()]
                  outside.append(prefix)
                  in_dollar = tag
                  continue
              outside.append(line)
          if re.search(r"(?im)^\\s*INSERT\\s+INTO\\b", "\\n".join(outside)):
              raise SystemExit("Snapshot contains a top-level INSERT statement. Refusing to restore.")
          print("Schema snapshot present; no COPY data blocks or top-level INSERT statements found.")
          PY

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Confirm the test database is empty
        shell: bash
        run: |
          set +x
          table_count="$(psql "$SUPABASE_TEST_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';")"
          if [ "$table_count" != "0" ]; then
            echo "::error::Refusing to overwrite a test database that already contains public tables."
            exit 1
          fi
          echo "Test database preflight passed: public schema contains no application tables."

      - name: Restore schema to the isolated test database
        shell: bash
        run: |
          set +x
          psql "$SUPABASE_TEST_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction --file=schema-artifact/schema.sql

      - name: Restore the custom auth.users profile trigger
        shell: bash
        run: |
          set +x
          psql "$SUPABASE_TEST_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction <<'SQL'
          DO $restore$
          BEGIN
            IF to_regprocedure('public.handle_new_auth_user()') IS NULL THEN
              RAISE EXCEPTION 'Required function public.handle_new_auth_user() is missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgrelid = 'auth.users'::regclass
                AND tgname = 'on_auth_user_created_profile'
                AND NOT tgisinternal
            ) THEN
              CREATE TRIGGER on_auth_user_created_profile
              AFTER INSERT ON auth.users
              FOR EACH ROW EXECUTE FUNCTION public.handle_new_auth_user();
            END IF;
          END
          $restore$;
          SQL

      - name: Verify restored schema inventory
        shell: bash
        run: |
          set +x
          psql "$SUPABASE_TEST_DB_URL" -X -v ON_ERROR_STOP=1 -Atqc "
            SELECT
              (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE') || ',' ||
              (SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname IN ('public','private')) || ',' ||
              (SELECT count(*) FROM pg_policies WHERE schemaname='public') || ',' ||
              (SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE NOT t.tgisinternal AND n.nspname='public') || ',' ||
              (SELECT count(*) FROM pg_trigger t JOIN pg_class c ON c.oid=t.tgrelid JOIN pg_namespace n ON n.oid=c.relnamespace WHERE NOT t.tgisinternal AND n.nspname='auth');
          " | grep -qx '12,17,32,15,1'
          echo "Verified: 12 public tables, 17 application functions, 32 public RLS policies, 15 public triggers, and 1 custom auth.users trigger."
