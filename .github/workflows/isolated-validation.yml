name: Isolated TruckSafe validation

on:
  push:
    branches:
      - test/isolated-e2e-ci
      - fix/physical-clearance-routing-gate
  pull_request:
    branches:
      - main
      - feat/ptv-safe-integration-v1
      - test/isolated-e2e-ci
      - fix/physical-clearance-routing-gate
      - docs/route-assessment-atomic-trip-start
  workflow_dispatch:
    inputs:
      confirm_test_auth:
        description: "Run live Auth integration against the dedicated Test project only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: isolated-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run application, safety and workflow tests
        run: npm run test:ci
      - name: Build Next.js application
        run: npx next build
      - name: Run isolated concurrent application smoke tests
        run: npm run test:smoke

  database-integration:
    concurrency:
      group: isolated-supabase-test-project
      cancel-in-progress: false
